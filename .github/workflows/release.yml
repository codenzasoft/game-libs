name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and sign artifacts into local Maven repository
        run: ./gradlew publishToMavenLocal
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Bundle artifacts for Central Portal
        run: |
          cd ~/.m2/repository
          for dir in \
            "com/codenzasoft/games/game-common/${RELEASE_VERSION}" \
            "com/codenzasoft/games/game-hearts/${RELEASE_VERSION}"; do
            find "${dir}" -type f \
              ! -name "*.md5" ! -name "*.sha1" \
              ! -name "*.sha256" ! -name "*.sha512" \
              ! -name "*.asc" | while read -r f; do
              md5sum "${f}"  | cut -d' ' -f1 > "${f}.md5"
              sha1sum "${f}" | cut -d' ' -f1 > "${f}.sha1"
            done
          done
          zip -r "$GITHUB_WORKSPACE/bundle.zip" \
            "com/codenzasoft/games/game-common/${RELEASE_VERSION}" \
            "com/codenzasoft/games/game-hearts/${RELEASE_VERSION}"

      - name: Upload bundle to Maven Central
        env:
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          TOKEN=$(echo "${CENTRAL_PORTAL_TOKEN}" | tr -d '[:space:]')
          curl --fail-with-body -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=game-libs-${RELEASE_VERSION}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "bundle=@bundle.zip"
