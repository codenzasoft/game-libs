plugins {
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.codenzasoft.games'
    // RELEASE_VERSION is set by the release workflow (strips the leading 'v' from the tag)
    version = System.getenv('RELEASE_VERSION') ?: '1.0.0-SNAPSHOT'

    java {
        sourceCompatibility = '17'
        withSourcesJar()
        withJavadocJar()
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation(
                'junit:junit:4.13.2',
                'org.spockframework:spock-core:2.4-M7-groovy-5.0',
                'net.bytebuddy:byte-buddy:1.15.11',
                'org.objenesis:objenesis:3.4',
        )
    }

    spotless {
        java {
            googleJavaFormat()
        }
    }

    compileJava.dependsOn('spotlessApply')

    test {
        useJUnitPlatform()
        testLogging {
            events "passed", "skipped", "failed"
        }
    }

    javadoc {
        failOnError = false
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    description = 'KingsHand card game engine and common game utilities'
                    url = 'https://github.com/codenzasoft/game-libs'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    developers {
                        developer {
                            id = 'codenzadarin'
                            name = 'Darin'
                            organization = 'Codenza Software Development Inc.'
                            organizationUrl = 'https://codenzasoft.ca'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/codenzasoft/game-libs.git'
                        developerConnection = 'scm:git:ssh://github.com/codenzasoft/game-libs.git'
                        url = 'https://github.com/codenzasoft/game-libs'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = 'https://maven.pkg.github.com/codenzasoft/game-libs'
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                    password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
                }
            }
        }
    }

    signing {
        def signingKey = System.getenv('GPG_SIGNING_KEY') ?: project.findProperty('signing.key')
        def signingPassword = System.getenv('GPG_SIGNING_PASSWORD') ?: project.findProperty('signing.password')
        if (signingKey) {
            useInMemoryPgpKeys(signingKey as String, signingPassword as String)
            sign publishing.publications.mavenJava
        }
    }

}
